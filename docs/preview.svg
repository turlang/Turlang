<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview real do README de perfil</title><desc id="desc">Captura fiel do README de perfil do GitHub.</desc><rect width="1600" height="900" fill="#0d1117"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect width="1600" height="900" fill="#0d1117"/><rect x="80" y="50" width="1440" height="800" rx="10" fill="#0d1117" stroke="#30363d"/><text x="120" y="110" fill="#f0f6fc" font-size="38" font-weight="600">Olá, eu sou Evandro Ricardo 👋</text><line x1="120" y1="135" x2="1480" y2="135" stroke="#21262d"/><text x="120" y="185" fill="#c9d1d9" font-size="20">Desenvolvedor Full Stack com foco em aplicações SaaS, React, Node.js, TypeScript, APIs REST,</text><text x="120" y="218" fill="#c9d1d9" font-size="20">MongoDB, Prisma, dashboards administrativos, automações e soluções com inteligência artificial.</text><text x="120" y="285" fill="#f0f6fc" font-size="28" font-weight="600">Projetos em destaque</text><line x1="120" y1="305" x2="1480" y2="305" stroke="#21262d"/><g font-size="18"><text x="135" y="350" fill="#c9d1d9">• </text><text x="160" y="350" fill="#58a6ff" font-weight="600">GlossFlow Enterprise</text><text x="365" y="350" fill="#c9d1d9"> — SaaS para salões de beleza, barbearias e clínicas.</text><text x="135" y="390" fill="#c9d1d9">• </text><text x="160" y="390" fill="#58a6ff" font-weight="600">LeadHunter Pro</text><text x="318" y="390" fill="#c9d1d9"> — Prospecção comercial, CRM 360 e agente SDR com IA.</text><text x="135" y="430" fill="#c9d1d9">• </text><text x="160" y="430" fill="#58a6ff" font-weight="600">Mestre Orc Engine — Fênix</text><text x="420" y="430" fill="#c9d1d9"> — Narração contextual, áudio e Foundry VTT.</text><text x="135" y="470" fill="#c9d1d9">• </text><text x="160" y="470" fill="#58a6ff" font-weight="600">SaaS Mestre Orc</text><text x="333" y="470" fill="#c9d1d9"> — Gestão de campanhas, personagens e reservas.</text><text x="135" y="510" fill="#c9d1d9">• </text><text x="160" y="510" fill="#58a6ff" font-weight="600">FinançasPro BI</text><text x="315" y="510" fill="#c9d1d9"> — Dashboard financeiro e PWA.</text></g><text x="120" y="585" fill="#f0f6fc" font-size="28" font-weight="600">Tecnologias</text><line x1="120" y1="605" x2="1480" y2="605" stroke="#21262d"/><g transform="translate(120 640)" font-size="16" font-weight="600"><rect width="140" height="38" rx="19" fill="#1f6feb"/><text x="38" y="25" fill="#fff">React</text><rect x="160" width="145" height="38" rx="19" fill="#238636"/><text x="198" y="25" fill="#fff">Node.js</text><rect x="325" width="165" height="38" rx="19" fill="#8957e5"/><text x="352" y="25" fill="#fff">TypeScript</text><rect x="510" width="165" height="38" rx="19" fill="#2ea043"/><text x="540" y="25" fill="#fff">MongoDB</text><rect x="695" width="135" height="38" rx="19" fill="#30363d"/><text x="735" y="25" fill="#fff">Prisma</text><rect x="850" width="135" height="38" rx="19" fill="#bf8700"/><text x="892" y="25" fill="#fff">IA</text></g><text x="120" y="750" fill="#f0f6fc" font-size="28" font-weight="600">Contato e portfólio</text><line x1="120" y1="770" x2="1480" y2="770" stroke="#21262d"/><text x="120" y="815" fill="#58a6ff" font-size="18">github.com/turlang</text><text x="340" y="815" fill="#58a6ff" font-size="18">turlang.github.io/portfoli/</text></g></svg>